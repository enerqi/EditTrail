name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The fast suite: edit_trail's logic against the fake Sublime API, plus lint and format.
  # Also runs on 3.8, the oldest plugin host a stable Sublime build may offer.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so this is pinned to an exact release.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      # Not `just qa`: typecheck needs Sublime's own sublime.py, which is not on this runner.
      # The justfile exports UV_PYTHON=3.14 itself, so uv ignores the 3.8 in .python-version.
      - run: just lint
      - run: just format --check
      - run: just test
      - run: just test-py38

  # The slow suite: the API assumptions the fake cannot check, run inside a real Sublime Text.
  # This is what notices a Sublime release changing behaviour the plugin is built on.
  api-assumptions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: SublimeText/UnitTesting/actions/setup@v1
        with:
          sublime-text-version: 4
      - uses: SublimeText/UnitTesting/actions/run-tests@v1
