[project]
# Development tooling only. EditTrail is a Sublime Text package, not a Python distribution: Package
# Control installs it from a git tag, and none of this file (or uv.lock, justfile, tests/) ships with it
# (see .gitattributes export-ignore).
name = "edit-trail"
version = "0.1.0"
description = "Sublime Text package: go back and forward through edit locations across files"
readme = "README.md"
# The interpreter for the dev environment (ruff, ty, pytest), NOT the plugin runtime. The plugin runs
# inside Sublime's plugin host and is written for Python 3.8 syntax (see ruff/ty target settings below).
# .python-version says "3.8" because that is what Sublime reads to pick its modern plugin host, and uv
# reads the same file, so the justfile exports UV_PYTHON to stop uv trying to build a 3.8 environment.
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.130",  # stateful property tests (tests/test_properties.py); needs >= 3.10, so not on the 3.8 run
    "pytest>=9",
    "ruff>=0.15",
    "ty>=0.0.31",  # beta
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]  # import edit_trail.py from the repo root

[tool.ty.environment]
# Check the plugin against the oldest syntax/stdlib its host may offer. The Sublime API modules
# (sublime.py, sublime_plugin.py) are not on PyPI; `just typecheck` passes Sublime's install Lib dir
# with --extra-search-path.
python-version = "3.8"

[[tool.ty.overrides]]
# Tests drive the plugin with lightweight fakes (tests/conftest.py) that duck-type sublime.View and
# sublime.Window rather than subclass them.
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
# The in-editor tests import UnitTesting, which is a Sublime package rather than a PyPI one: it is
# on sys.path inside the editor and nowhere on a dev machine.
include = ["st_tests/**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "A",        # flake8-builtins - shadowing builtins (`id`, `type`, `list` as parameter / variable names)
    "ANN",      # flake8-annotations - missing type annotations on public functions/methods (see ANN401 ignore)
    "ARG",      # flake8-unused-arguments - unused function/method/lambda args
    "ASYNC",    # flake8-async - blocking calls inside async functions (open(), time.sleep, requests, subprocess)
    "B",        # flake8-bugbear - likely bugs / design flaws (mutable default args, B008, B904 raise-from, etc.)
    "BLE",      # flake8-blind-except - bare `except:` / `except Exception:` without re-raise or logging
    "C4",       # flake8-comprehensions - wasteful list/set/dict comprehensions and generator misuse
    "DTZ",      # flake8-datetimez - naive datetime usage (force tz-aware)
    "E",        # pycodestyle errors - PEP 8 errors (whitespace, indentation, statement separation)
    "EM",       # flake8-errmsg - exception message must be variable, not literal/f-string inside `raise`
    "F",        # Pyflakes - unused imports/vars, undefined names, redefinitions
    "FIX001",   # flake8-fixme - line contains FIXME (ban only; TODO/XXX/HACK left informational)
    "FLY",      # flynt - static `str.join`/`%`-format/`.format` -> f-string
    "G",        # flake8-logging-format - `logger.info("x %s", v)` not `logger.info(f"x {v}")`
    "I001",     # isort - import block sort/group order (only the "unsorted" rule, not the broader I)
    "INP",      # flake8-no-pep420 - missing `__init__.py` (no implicit namespace packages)
    "ISC",      # flake8-implicit-str-concat - catch accidental adjacent-string-literal concatenation
    "LOG",      # flake8-logging - modern logging API misuse (complements G's format-string focus)
    "N",        # pep8-naming - class CamelCase, function snake_case, constant SCREAMING_SNAKE
    "PERF",     # Perflint - `.append` in loops vs list-comp, unnecessary list() in `any()`/`all()`, etc.
    "PGH004",   # pygrep-hooks - ban blanket `# noqa` (require specific code)
    "PIE",      # flake8-pie - misc anti-patterns (unnecessary dict/list/pass, duplicate class fields)
    "PT",       # flake8-pytest-style - pytest idioms (parametrize tuples, fixture scope, raises usage)
    "PTH",      # flake8-use-pathlib - prefer `pathlib.Path` over `os.path` / `os.makedirs` / `open(...)`
    "Q",        # flake8-quotes - consistent quote style (matches `ruff format`)
    "RET",      # flake8-return - unnecessary `else` after return, redundant `return None`, etc.
    "RSE",      # flake8-raise - unnecessary parens on `raise Foo()`
    "RUF",      # Ruff-specific - extras the Ruff team owns (RUF005 list-concat, RUF012 mutable class attrs, etc.)
    "S",        # flake8-bandit - security smells (eval, pickle, hardcoded passwords, subprocess shell=True)
    "SIM",      # flake8-simplify - collapse `if-else` ternaries, `dict.get`, contextlib.suppress, etc.
    "SLF",      # flake8-self - access to `_private` members from outside the owning class
    "T10",      # flake8-debugger - leftover `breakpoint()` / `pdb.set_trace()`
    "T20",      # flake8-print - leftover `print()` / `pprint()`
    "TCH",      # flake8-type-checking - push annotation-only imports under `if TYPE_CHECKING:` (see TC ignores)
    "TRY",      # tryceratops - exception-handling smells (long try blocks, raise-from, abstract-raise)
    "UP",       # pyupgrade - modernise syntax for `target-version` (typing.Optional -> `| None`, super(), f-strings)
    "W",        # pycodestyle warnings - trailing whitespace, blank-line newlines, etc.
    "YTT",      # flake8-2020 - incorrect `sys.version` / `sys.version_info` comparisons
]
ignore = [
    "S101",     # flake8-bandit - keep `assert` statements; we use them as sanity checks, not just test scaffolding.
    "PT001",    # flake8-pytest-style - parentheses-on-fixture style. Bikeshed; don't churn over it.
    "TRY002",   # tryceratops - "create your own exception type". Generic exceptions are fine internally.
    "TRY003",   # tryceratops - "avoid long messages outside the exception class". Messages at the raise site help.
    "ISC001",   # flake8-implicit-str-concat - conflicts with `ruff format`; let the formatter own this.
    "ANN401",   # flake8-annotations - ban `typing.Any`. Used deliberately at duck-typed boundaries.
    "TC001",    # flake8-type-checking - annotation-only first-party imports under TYPE_CHECKING. Annotations are
    "TC002",    #     already lazy via `from __future__ import annotations`, so moving imports gains nothing and
    "TC003",    #     confuses tooling that resolves runtime types.
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# S311: (Standard pseudo-random generators are not suitable for cryptographic purposes)
# ARG001/ARG002: unused args common for fixtures and fakes mirroring the Sublime API signatures
# N802: fakes mirror Sublime API method names
# SLF001: tests inspect the plugin's private state (_State, _Config, _navigate)
# ANN is deliberately NOT ignored: tests and fakes are fully typed like the plugin.
"tests/*" = ["S311", "ARG001", "ARG002", "SLF001", "N802"]
# PT009/PT027: the in-editor tests are unittest TestCases, because that is what UnitTesting runs.
"st_tests/*" = ["PT009", "PT027"]
